<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name -->
  <policy user="root">
    <allow own="org.ciel.Mount"/>
    <allow send_destination="org.ciel.Mount"/>
  </policy>

  <!-- Everyone else may call methods and receive signals -->
  <policy context="default">
    <allow send_destination="org.ciel.Mount"/>
    <allow receive_sender="org.ciel.Mount"/>
    <allow receive_path="/org/ciel/Mount"/>
    <allow receive_interface="org.ciel.Mount"/>
  </policy>
</busconfig>
